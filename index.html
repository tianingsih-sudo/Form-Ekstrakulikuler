<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Form Pendaftaran Ekstrakurikuler</title>

    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <main class="container">
        <form id="formPendaftaran">

            <h1>Pendaftaran Ekstrakurikuler</h1>
            <p class="subtitle">Silakan isi data diri dengan benar</p>

            <!-- Nama Lengkap -->
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Masukkan nama lengkap">
                <small id="errorNama"></small>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="contoh@email.com">
                <small id="errorEmail"></small>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Minimal 8 karakter">
                <small id="errorPassword"></small>
            </div>

            <!-- Konfirmasi Password -->
            <div class="form-group">
                <label for="konfirmasi">Konfirmasi Password</label>
                <input type="password" id="konfirmasi" placeholder="Masukkan ulang password">
                <small id="errorKonfirmasi"></small>
            </div>

            <!-- Ekstrakurikuler -->
            <div class="form-group">
                <label for="ekskul">Pilihan Ekstrakurikuler</label>

                <select id="ekskul">
                    <option value="">-- Pilih Ekstrakurikuler --</option>
                    <option value="Pramuka">Pramuka</option>
                    <option value="PMR">PMR</option>
                    <option value="Paskibra">Paskibra</option>
                    <option value="OSIS">OSIS</option>
                    <option value="MTQ">MTQ</option>
                    <option value="Rohis">Rohis</option>
                    <option value="Bahasa Jepang">Bahasa Jepang</option>
                    <option value="Rebana">Rebana</option>
                    <option value="Voli">Voli</option>
                    <option value="Tari">Tari</option>
                    <option value="Pencak Silat">Pencak Silat</option>
                    <option value="Foster">Foster</option>
                </select>

                <small id="errorEkskul"></small>
            </div>

            <button type="submit">Daftar</button>

            <p id="pesanSukses"></p>

        </form>
    </main>

    <!-- CHATBOT -->
    <button class="chat-launcher" id="chatLauncher" type="button" aria-label="Buka chatbot bantuan">
        <span class="dot"></span>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 12C4 7.58 7.58 4 12 4s8 3.58 8 8-3.58 8-8 8c-1.28 0-2.48-.3-3.55-.84L4 20l1.02-3.9A7.94 7.94 0 0 1 4 12Z" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="8.5" cy="12" r="1" fill="white"/>
            <circle cx="12" cy="12" r="1" fill="white"/>
            <circle cx="15.5" cy="12" r="1" fill="white"/>
        </svg>
    </button>

    <div class="chat-panel" id="chatPanel" hidden>
        <div class="chat-header">
            <div class="avatar">🤖</div>
            <div class="info">
                <strong>Asisten Pendaftaran</strong>
                <span><span class="status-dot"></span>Siap membantu</span>
            </div>
            <button class="chat-close" id="chatClose" type="button" aria-label="Tutup chatbot">✕</button>
        </div>
        <div class="chat-body" id="chatBody"></div>
        <div class="chat-suggestions" id="chatSuggestions"></div>
        <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="Tulis pertanyaanmu di sini...">
            <button class="chat-send" id="chatSend" type="button" aria-label="Kirim pesan">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="white" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="script1.js"></script>

</body>
</html>
